services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: uretos-rabbitmq
    env_file:
      - .env
    ports:
      - "5673:5672"   # AMQP protocol port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uretos-net

  machine-api:
    build:
      context: ./services/machine-api
      dockerfile: Dockerfile
    container_name: uretos-machine-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      SERVICE_VERSION: "0.1.0"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - uretos-net

  machine-db:
    image: postgres:16-alpine
    container_name: uretos-machine-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uretos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uretos_dev_pass}
      POSTGRES_DB: machine_db
    ports:
      - "5432:5432"
    volumes:
      - machine_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uretos -d machine_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uretos-net

  machine-storage:
    build:
      context: ./services/machine-storage
      dockerfile: Dockerfile
    container_name: uretos-machine-storage
    env_file:
      - .env
    ports:
      - "8001:8001"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      POSTGRES_HOST: machine-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-uretos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uretos_dev_pass}
      POSTGRES_DB: machine_db
      SERVICE_VERSION: "0.1.0"
    depends_on:
      rabbitmq:
        condition: service_healthy
      machine-db:
        condition: service_healthy
    networks:
      - uretos-net

volumes:
  machine_db_data:

networks:
  uretos-net:
    driver: bridge